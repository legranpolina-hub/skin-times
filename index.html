<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balance — мой день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;600;700;800&family=Inter+Tight:wght@500;700;900&family=PT+Serif:ital@0;1&family=Lora:ital,wght@0,500;0,600;1,500&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Manrope","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;color:#111;background:#F5F4F1}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8E72C4;outline-offset:2px}
.page{display:none;max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(104px + env(safe-area-inset-bottom,0px))}
body[data-tab="home"] #p-home,body[data-tab="care"] #p-care,body[data-tab="eng"] #p-eng,body[data-tab="med"] #p-med,body[data-tab="models"] #p-models,body[data-tab="work"] #p-work{display:block}
.chk svg{width:14px;height:14px;opacity:0}

/* NAV */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(464px,calc(100% - 16px));display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:rgba(18,16,20,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:24px;padding:6px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.nav button{appearance:none;border:0;background:none;color:#A9A3AD;font-size:10.5px;font-weight:700;padding:7px 0 6px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav .ic{font-size:19px;line-height:1}
.nav button[aria-current="page"]{background:rgba(255,255,255,.15);color:#fff}

/* SHEET / CONFIRM */
.modal{position:fixed;inset:0;background:rgba(10,8,12,.45);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:12px}
.modal.open{display:flex}
.sheet{background:#fff;color:#111;border-radius:26px;padding:20px;width:100%;max-width:470px;max-height:88vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet h3{margin:0 0 14px;font-size:20px;font-weight:800}
.sheet p{margin:0 0 16px;color:#555;line-height:1.45}
.f{display:block;font-size:12px;font-weight:700;color:#8a8590;margin:10px 0 5px 2px}
.inp{width:100%;border:1.5px solid #ECE8EE;background:#F7F5F8;color:#111;border-radius:14px;padding:11px 12px;font:inherit;font-size:15px}
textarea.inp{min-height:70px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{appearance:none;display:block;width:100%;border:0;background:#111;color:#fff;border-radius:999px;padding:14px;font-weight:800;font-size:15px;margin-top:12px}
.btn.ghost{background:#F1EFF2;color:#111}
.btn.red{background:#D44C47}

/* HOME */
body[data-tab="home"]{background:#F5F4F1;color:#111}
.h-hi{font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.02;margin:8px 0 4px}
.h-date{color:#8a8580;font-size:14px;font-weight:600;margin-bottom:14px}
.h-sum{background:#111;color:#fff;border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.h-sum b{font-size:34px;font-weight:800;line-height:1}
.h-sum span{font-size:13.5px;color:#cfc9d3;line-height:1.35}
.h-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
.h-bar i{display:block;height:100%;background:#CDBCE7;border-radius:6px}
.hc{appearance:none;display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:22px;padding:14px 16px;margin-top:10px}
.hc-top{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.hc-go{margin-left:auto;color:#aaa;font-weight:600;font-size:12.5px}
.hc-b{margin-top:7px;font-size:14px;color:#555;line-height:1.45}
.hc-b b{color:#111}
.hc-row{display:flex;gap:10px;padding:5px 0;border-top:1px solid #F0EEEB}
.hc-row:first-child{border-top:0}
.hc-row time{font-weight:700;color:#111;min-width:92px;font-variant-numeric:tabular-nums}
.todo{background:#fff;border-radius:22px;padding:14px 16px;margin-top:10px}
.todo h3{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
.todo-add{display:flex;gap:8px;margin-top:8px}
.todo-add input{flex:1;border:1.5px solid #ECEAE6;background:#F7F6F3;border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;color:#111}
.todo-add button{appearance:none;border:0;background:#111;color:#fff;border-radius:14px;padding:0 16px;font-weight:800;font-size:18px}
.ti{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0EEEB}
.ti:first-of-type{border-top:0}
.ti .chk{appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid #DDD8D2;background:none;display:grid;place-items:center;flex:none;padding:0}
.ti.done .chk{background:#111;border-color:#111}
.ti.done .chk svg{opacity:1}
.ti span{flex:1;font-size:15px;line-height:1.35;word-break:break-word}
.ti.done span{color:#aaa;text-decoration:line-through}
.ti .x{appearance:none;border:0;background:none;color:#bbb;font-size:18px;padding:2px 6px}
.empty{color:#9a958f;font-size:14px;padding:4px 0}

/* CARE */
body[data-tab="care"]{background:#F3EEF0;color:#000;font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif}
.c-top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px;border-bottom:2px solid #000}
.c-logo{font-family:"UnifrakturMaguntia",serif;font-size:36px;line-height:1}
.c-date{font-size:13px;color:#5A5156;text-align:right;line-height:1.3}
.c-date b{display:block;color:#000;font-size:14px}
.c-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0}
.c-days button{appearance:none;border:1.5px solid #E7DDE2;background:#fff;border-radius:12px;padding:8px 0 7px;text-align:center}
.c-days .d{display:block;font-weight:900;font-size:15px}
.c-days .dt{display:block;width:6px;height:6px;border-radius:50%;margin:5px auto 0;background:#E7DDE2}
.c-days .full .dt{background:#D63E77}
.c-days .today{border-color:#000}
.c-days button[aria-selected="true"]{background:#000;color:#fff;border-color:#000}
.c-hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 20px;background:linear-gradient(150deg,#FDE6EF,#F48FB5);min-height:160px}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.35) 20%,rgba(244,143,181,.5) 46%,rgba(214,62,119,.85) 100%)}
.b1{width:120px;height:120px;right:-26px;bottom:-30px}.b2{width:50px;height:50px;right:78px;top:16px}.b3{width:22px;height:22px;right:44px;top:70px}
.c-tag{display:inline-block;background:#000;color:#fff;font-weight:900;font-size:11px;letter-spacing:.04em;padding:5px 8px}
.c-hero h1{position:relative;font-weight:900;font-size:30px;line-height:1.02;margin:12px 0 6px;max-width:75%;text-transform:uppercase}
.c-hero p{position:relative;font-family:"PT Serif",Georgia,serif;font-style:italic;font-size:15px;margin:0;max-width:70%}
.c-seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1.5px solid #E7DDE2;border-radius:16px;padding:4px;margin:14px 0 6px}
.c-seg button{appearance:none;border:0;background:transparent;font-weight:700;font-size:16px;padding:12px 6px;border-radius:12px}
.c-seg small{display:block;font-weight:500;font-size:12px;color:#9A8D93;margin-top:2px}
.c-seg button[aria-selected="true"]{background:#F48FB5}
.c-seg button[aria-selected="true"] small{color:#000}
.c-prog{display:flex;align-items:center;gap:10px;margin:14px 2px 10px;font-weight:700;font-size:14px}
.c-bar{flex:1;height:8px;border-radius:8px;background:#E7DDE2;overflow:hidden}
.c-bar i{display:block;height:100%;background:#D63E77;border-radius:8px}
.c-daily{background:#fff;border:1.5px solid #E7DDE2;border-radius:16px;padding:12px 14px;margin-bottom:8px}
.c-daily h4{margin:0 0 8px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.c-chips{display:flex;flex-wrap:wrap;gap:6px}
.c-chip{appearance:none;border:1.5px solid #E7DDE2;background:#FBF7F9;border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px}
.c-chip[aria-pressed="true"]{background:#D63E77;border-color:#D63E77;color:#fff;text-decoration:line-through}
.c-steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.c-step{appearance:none;width:100%;display:grid;grid-template-columns:34px 1fr 30px;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid #E7DDE2;border-radius:16px;padding:13px 14px}
.c-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;background:#F3EEF0}
.c-name{display:block;font-weight:900;font-size:17px;line-height:1.2}
.c-prod{display:block;font-size:13px;color:#9A8D93;margin-top:2px}
.c-how{display:block;font-family:"PT Serif",Georgia,serif;font-size:14.5px;color:#5A5156;margin-top:5px;line-height:1.35}
.c-step .chk{width:28px;height:28px;border-radius:50%;border:2px solid #E7DDE2;display:grid;place-items:center}
.c-step.key{border-color:#F48FB5;background:#FCE3EC}
.c-step.key .c-n{background:#F48FB5}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:2px;background:#F48FB5;color:#000}
.badge.opt{background:transparent;border:1px solid #9A8D93;color:#9A8D93}
.c-step.done{background:#FBEFF4;border-color:#E7DDE2}
.c-step.done .c-name{text-decoration:line-through;text-decoration-color:#D63E77;text-decoration-thickness:2px}
.c-step.done .c-how{display:none}
.c-step.done .chk{background:#D63E77;border-color:#D63E77}
.c-step.done .chk svg{opacity:1}
.c-fin{text-align:center;margin:16px 0 0;padding:16px;border-radius:16px;background:#000;color:#fff;font-weight:900;font-size:18px}
.c-fin small{display:block;font-family:"PT Serif",serif;font-weight:400;font-style:italic;font-size:14px;margin-top:4px;color:#F9C3D7}
.c-det{margin-top:14px;background:#fff;border:1.5px solid #E7DDE2;border-radius:16px;padding:0 16px}
.c-det summary{cursor:pointer;font-weight:900;font-size:16px;padding:14px 0;list-style:none}
.c-det summary::-webkit-details-marker{display:none}
.c-det ul{margin:0 0 14px;padding-left:18px;font-family:"PT Serif",serif;font-size:15px;line-height:1.5;color:#5A5156}
.c-week div{display:flex;justify-content:space-between;font-size:15px;padding:8px 0;border-bottom:1px solid #E7DDE2}
.c-week div:last-child{border:0;margin-bottom:6px}

/* ENGLISH */
body[data-tab="eng"]{color:#3A2E44;background:linear-gradient(160deg,#A8A7D8 0%,#C3B2D6 30%,#DDB8BE 55%,#C99A99 78%,#E5C3B6 100%)}
.e-title{font-weight:800;font-size:38px;color:#fff;letter-spacing:-.01em;line-height:1;margin:10px 0 4px;text-shadow:0 0 18px rgba(255,255,255,.95),0 0 3px #fff}
.e-sub{color:rgba(255,255,255,.92);font-size:13px;font-weight:600;margin-bottom:14px}
.glass{background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.65);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:24px;padding:14px 16px;margin-bottom:10px}
.e-map{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.lc{aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);font-size:10.5px;font-weight:700;display:grid;place-items:center;color:#3A2E44}
.lc.half{background:rgba(255,255,255,.45)}
.lc.done{background:#fff;color:#7B5EA7}
.lc.ms{box-shadow:0 0 0 2.5px rgba(255,255,255,.35),0 0 0 4px rgba(255,255,255,.8)}
.e-stats{display:flex;justify-content:space-between;margin-top:12px;font-size:13.5px;font-weight:700}
.e-today h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.e-today h2{margin:6px 0 2px;font-size:22px;font-weight:800;line-height:1.15}
.e-today p{margin:0 0 12px;font-size:13.5px;opacity:.8}
.e-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.e-btn{appearance:none;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.2);border-radius:999px;padding:12px 8px;font-weight:800;font-size:14px;color:#3A2E44}
.e-btn[aria-pressed="true"]{background:#fff;color:#7B5EA7}
.e-blk{padding:0;overflow:hidden}
.e-bh{appearance:none;width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:14px 16px;text-align:left}
.e-bh b{font-size:15px;font-weight:800}
.e-bh span{margin-left:auto;font-size:12.5px;font-weight:700;opacity:.75}
.e-bh i{font-style:normal;opacity:.6;font-size:12px}
.e-lh{display:flex;justify-content:flex-end;gap:14px;padding:0 16px 2px;font-size:10.5px;font-weight:700;opacity:.7}
.e-row{display:flex;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid rgba(255,255,255,.45)}
.e-row .num{width:22px;font-size:12px;font-weight:700;opacity:.65}
.e-row .t{flex:1;font-size:14.5px;line-height:1.3}
.e-row.done .t{opacity:.6;text-decoration:line-through}
.e-c{appearance:none;width:26px;height:26px;border-radius:50%;border:1.6px solid #3A2E44;background:transparent;padding:0;display:grid;place-items:center;opacity:.8}
.e-c[aria-pressed="true"]{background:#7B5EA7;border-color:#7B5EA7;opacity:1}
.e-c[aria-pressed="true"] svg{opacity:1}
.e-c svg{width:12px;height:12px;opacity:0}
.e-note{font-size:13.5px;opacity:.85;line-height:1.45}
.e-dash{border-style:dashed}

/* MED */
body[data-tab="med"]{color:#1E2140;background:linear-gradient(170deg,#F1F2FD 0%,#E9EBFB 45%,#E3E6FA 100%)}
.md-blob{position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-1;pointer-events:none}
.md-b1{background:#C7C9FF;top:-80px;right:-60px}.md-b2{background:#D9CCFF;bottom:80px;left:-120px}
.md-hi{font-size:14px;color:#8A8FB0;font-weight:600;margin-top:6px}
.md-title{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}
.md-sub{font-size:14px;color:#6B7094;margin:0 0 16px;line-height:1.4}
.md-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.md-stat{background:rgba(255,255,255,.72);border:1px solid #fff;border-radius:20px;padding:12px;box-shadow:0 8px 24px rgba(99,102,241,.08);min-width:0}
.md-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;margin-bottom:8px}
.md-stat b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.md-stat span{display:block;font-size:11.5px;color:#8A8FB0;font-weight:600;margin-top:2px}
.md-goal{position:relative;overflow:hidden;margin-top:12px;border-radius:24px;padding:16px 18px 18px;color:#fff;background:linear-gradient(120deg,#6E6BF0 0%,#8B7CF6 55%,#A99BFA 100%);box-shadow:0 14px 30px rgba(110,107,240,.3)}
.md-goal svg{position:absolute;right:-10px;bottom:-4px;width:190px;opacity:.35}
.md-gl{position:relative;font-size:12.5px;font-weight:600;opacity:.9}
.md-goal h2{position:relative;margin:6px 0 4px;font-size:21px;font-weight:800;line-height:1.15;max-width:85%}
.md-goal p{position:relative;margin:0 0 12px;font-size:13px;opacity:.92;line-height:1.4}
.md-gbar{position:relative;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700}
.md-gbar div{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.3);overflow:hidden}
.md-gbar i{display:block;height:100%;background:#fff;border-radius:8px}
.md-wk{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.md-wk b{font-size:17px;font-weight:800}
.md-arr{appearance:none;width:36px;height:36px;border-radius:50%;border:1px solid #fff;background:rgba(255,255,255,.75);font-size:16px;color:#4B4FD0;display:grid;place-items:center}
.md-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.md-day{appearance:none;border:1px solid #fff;background:rgba(255,255,255,.62);border-radius:16px;padding:8px 0;text-align:center;min-width:0}
.md-day .w{display:block;font-size:11.5px;color:#8A8FB0;font-weight:700}
.md-day .n{display:block;font-size:17px;font-weight:800;margin-top:1px}
.md-day .p{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent}
.md-day.has .p{background:#7C6CF2}
.md-day.today{box-shadow:inset 0 0 0 2px #A5A8F5}
.md-day[aria-selected="true"]{background:linear-gradient(140deg,#6E6BF0,#8B7CF6);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(110,107,240,.3)}
.md-day[aria-selected="true"] .w{color:#E6E4FF}
.md-day[aria-selected="true"] .p{background:#fff}
.md-dh{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.md-dh h3{margin:0;font-size:18px;font-weight:800}
.md-plus{appearance:none;flex:none;width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(140deg,#6E6BF0,#8B7CF6);color:#fff;font-size:24px;box-shadow:0 8px 18px rgba(110,107,240,.35);display:grid;place-items:center;line-height:1}
.md-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.78);border:1px solid #fff;border-radius:20px;padding:12px 6px 12px 14px;margin-bottom:8px;box-shadow:0 6px 18px rgba(99,102,241,.07)}
.md-chk{appearance:none;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #C5C8E8;background:#fff;padding:0;display:grid;place-items:center}
.md-chk svg{width:14px;height:14px;opacity:0}
.md-item.done .md-chk{background:#6E6BF0;border-color:#6E6BF0}
.md-item.done .md-chk svg{opacity:1}
.md-body{flex:1;min-width:0}
.md-time{font-size:12.5px;font-weight:700;color:#6E6BF0}
.md-subj{font-size:15.5px;font-weight:700;line-height:1.25;margin-top:1px;word-break:break-word}
.md-item.done .md-subj{color:#9A9EBE;text-decoration:line-through}
.md-meta{font-size:12.5px;color:#8A8FB0;margin-top:3px;line-height:1.4}
.md-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.md-tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#EEF0FF;color:#5A5ED6}
.md-tag.pr{background:#FFF4E5;color:#B7791F}.md-tag.sem{background:#E8F7EF;color:#2F855A}.md-tag.ex{background:#FDECEC;color:#C53030}.md-tag.dr{background:#F3EEFF;color:#7B5BD6}
.md-more{appearance:none;flex:none;border:0;background:none;color:#A3A7C7;font-size:20px;width:34px;height:40px;line-height:1;font-weight:800}
.md-empty{background:rgba(255,255,255,.5);border:1.5px dashed #C9CCEB;border-radius:20px;padding:18px;text-align:center;color:#8A8FB0;font-size:14px}
.md-note{background:rgba(255,255,255,.78);border:1px solid #fff;border-radius:22px;padding:14px 16px;margin-top:10px;box-shadow:0 6px 18px rgba(99,102,241,.07)}

document.addEventListener("click",function(e){

    var old=S.med.filter(function(c){return c.id===d.id;})[0];
    var rec={id:d.id||uid(),date:date,start:val("fs"),end:val("fe"),subj:subj,type:val("ft"),place:val("fp"),topic:val("fto"),dress:val("fdr"),done:old?!!old.done:false};
    if(d.id)S.med=S.med.map(function(c){return c.id===d.id?rec:c;});else S.med.push(rec);medSel=date;closeSheet();break;
  case "med-del":confirmBox("Удалить пару?","Пара исчезнет из расписания.","Удалить",function(){S.med=S.med.filter(function(c){return c.id!==d.id;});commit();render();});return;
  case "med-done":S.med.forEach(function(c){if(c.id===d.id)c.done=!c.done;});haptic();break;
  case "med-wk":medOff+=+d.d;medSel=medOff===0?TD():iso(addDays(monday(today()),medOff*7));render();return;

    else{var cm=curModel();cm.name=nm||cm.name;cm.start=stt;}
    mSel=null;closeSheet();break;
  case "m-del":var dm=curModel();confirmBox("Удалить модель «"+esc(dm.name)+"»?","Вместе с ней удалятся её отметки и заметки. Вернуть их будет нельзя.","Удалить",function(){S.models.list.splice(S.models.cur,1);S.models.cur=0;mSel=null;commit();render();});return;

  case "w-del":S.work.custom=S.work.custom.filter(function(c){return c.id!==d.id;});delete S.work.done[d.id];break;

  commit();render();
});

  else{var m=curModel();if(!m)return;
    if(k==="m-notes")m.notes=e.target.value;
    if(k==="m-daynote"){m.dayNotes=m.dayNotes||{};m.dayNotes[mSel]=e.target.value;}}
  clearTimeout(nT);nT=setTimeout(commit,400);
});
go("home");
cloudLoad();
})();
